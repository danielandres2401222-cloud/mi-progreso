<script>
/* =========================================================
   ANIMACIONES (figura de palitos, vista lateral)
   ========================================================= */
const D2R = Math.PI/180;
const dir = (a,l)=>[Math.sin(a*D2R)*l, Math.cos(a*D2R)*l];
const add = (p,q)=>[p[0]+q[0],p[1]+q[1]];
const LEN = {torso:52, ua:27, fa:25, th:36, sh:36, foot:11};
function ik(S,T,a,b,k){
  const dx=T[0]-S[0], dy=T[1]-S[1];
  let d=Math.hypot(dx,dy); d=Math.max(Math.abs(a-b)+0.5, Math.min(a+b-0.01,d));
  const base=Math.atan2(dy,dx), off=Math.acos((a*a+d*d-b*b)/(2*a*d));
  const ang=base-k*off, J=[S[0]+a*Math.cos(ang), S[1]+a*Math.sin(ang)];
  const a2=Math.atan2(T[1]-J[1],T[0]-J[0]);
  return [J,[J[0]+b*Math.cos(a2), J[1]+b*Math.sin(a2)]];
}
function limb(S,sp,a,b){
  if(sp.t) return ik(S,sp.t,a,b,sp.k||1);
  const J=add(S,dir(sp.a,a)); return [J, add(J,dir(sp.b,b))];
}
function solve(p){
  const hip=p.hip;
  let ta=p.torso;
  if(p.neck){ ta=Math.atan2(p.neck[0]-hip[0], p.neck[1]-hip[1])/D2R; }
  const neck=add(hip,dir(ta,LEN.torso)), sho=add(hip,dir(ta,LEN.torso-5)), head=add(hip,dir(ta,LEN.torso+14));
  const arms=p.arms.map(s=>limb(sho,s,LEN.ua,LEN.fa));
  const legs=p.legs.map(s=>{const r=limb(hip,s,LEN.th,LEN.sh); r.push(add(r[1],dir(s.f??90,LEN.foot))); return r;});
  return {hip,neck,sho,head,arms,legs};
}
function lerp(a,b,t){
  if(typeof a==='number') return a+(b-a)*t;
  if(Array.isArray(a)) return a.map((v,i)=>lerp(v,b[i],t));
  if(a&&typeof a==='object'){const o={}; for(const k in a) o[k]=(k==='k')?a[k]:lerp(a[k],b[k],t); return o;}
  return a;
}
const ln=(p,q,c,w)=>['line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:c,'stroke-width':w,'stroke-linecap':'round'}];
function chair(x,y,back){ // asiento de x a x+40 a la altura y
  const c='#9a9a9a'; const bx= back==='L'?x:x+40;
  return [ln([x,y],[x+40,y],c,4),ln([x+3,y],[x+3,200],c,3),ln([x+37,y],[x+37,200],c,3),ln([bx,y],[bx,y-46],c,4)];
}
function props(list,dark){
  const out=[], fill=dark?'#2c2c2c':'#e6e6e6', st=dark?'#666':'#b5b5b5';
  (list||[]).forEach(p=>{
    if(p==='chairBack') out.push(...chair(58,168,'L'));
    if(p==='chairFront') out.push(...chair(156,168,'R'));
    if(p==='chairSeat') out.push(...chair(82,166,'L'));
    if(p==='counter') out.push(['rect',{x:188,y:150,width:60,height:50,fill,stroke:st,'stroke-width':2}]);
    if(p==='wall') out.push(['rect',{x:184,y:20,width:12,height:180,fill,stroke:st,'stroke-width':2}]);
    if(p==='mat') out.push(['rect',{x:28,y:198,width:190,height:4,rx:2,fill:dark?'#3a3a3a':'#cfcfcf'}]);
  });
  return out;
}
function figureShapes(ex,pose,dark,tms){
  const F=solve(pose), fg=dark?'#f2f2f2':'#0a0a0a', bk=dark?'#6d6d6d':'#a8a8a8', hole=dark?'#000':'#fff';
  const w=ex.w, sh=[ln([0,201],[240,201],dark?'#444':'#d0d0d0',2), ...props(ex.props,dark)];
  const db=(p,c)=>{sh.push(['rect',{x:p[0]-3,y:p[1]-8,width:6,height:16,rx:2,fill:c}]); sh.push(['circle',{cx:p[0],cy:p[1],r:2,fill:hole}]);};
  const leg=(L,c)=>{ sh.push(ln(F.hip,L[0],c,10.5), ln(L[0],L[1],c,8), ln(L[1],L[2],c,6.5)); };
  const arm=(A,c)=>{ sh.push(ln(F.sho,A[0],c,8), ln(A[0],A[1],c,6.5), ['circle',{cx:A[1][0],cy:A[1][1],r:4.6,fill:c}]); };
  const ta=Math.atan2(F.neck[0]-F.hip[0],F.neck[1]-F.hip[1])/D2R;
  const mid=add(F.hip,dir(ta,24)), neckTop=add(F.hip,dir(ta,LEN.torso+4));
  leg(F.legs[1],bk);
  // tronco con volumen, cuello delgado y cabeza
  sh.push(ln(F.hip,F.sho,fg,15), ln(F.sho,neckTop,fg,5.5), ['circle',{cx:F.sho[0],cy:F.sho[1],r:6.5,fill:fg}], ['circle',{cx:F.head[0],cy:F.head[1],r:11,fill:fg}]);
  leg(F.legs[0],fg); arm(F.arms[0],fg);
  if(w===true||(Array.isArray(w)&&w[0])) db(F.arms[0][1],fg);
  if(w==='goblet'){const m=lerp(F.arms[0][1],F.arms[1][1],.5); sh.push(['rect',{x:m[0]-6.5,y:m[1]-12,width:13,height:24,rx:4,fill:fg}]);}
  // ---- efecto "quema": músculos que trabaja el ejercicio ----
  const t=(tms||0)/1000, pulse=0.5+0.5*Math.sin(t*5.2);
  const glow=(p,q,wd)=>{ sh.push(ln(p,q,'#ff7a1a',wd+9)); sh[sh.length-1][1].opacity=0.14+0.16*pulse;
                         sh.push(ln(p,q,'#ff3d1f',wd-2)); sh[sh.length-1][1].opacity=0.55+0.4*pulse; };
  const ARMS=[F.arms[0]];
  (ex.m||[]).forEach(mu=>{
    if(mu==='muslo') F.legs.forEach(L=>glow(F.hip,L[0],10.5));
    if(mu==='pantorrilla') F.legs.forEach(L=>glow(L[0],L[1],8));
    if(mu==='gluteo') glow(add(F.hip,dir(ta-90,-3)),add(F.hip,dir(ta,9)),14);
    if(mu==='abdomen') glow(add(F.hip,dir(ta,3)),mid,13);
    if(mu==='pecho'||mu==='espalda') glow(mid,F.sho,14);
    if(mu==='hombro') glow(add(F.sho,dir(ta,-4)),add(F.sho,dir(ta,3)),13);
    if(mu==='brazo') ARMS.forEach(A=>glow(F.sho,A[0],8));
  });
  return sh;
}
const MUSC_N={muslo:'piernas',pantorrilla:'pantorrillas',gluteo:'glúteos',abdomen:'abdomen',pecho:'pecho',espalda:'espalda',hombro:'hombros',brazo:'brazos'};
const musc=x=>(x.m||[]).map(k=>MUSC_N[k]).join(', ');
const fmtA=v=>typeof v==='number'?v.toFixed(1):v;
function figureSVG(ex,pose,dark){
  return '<svg viewBox="0 0 240 210" xmlns="http://www.w3.org/2000/svg">'+figureShapes(ex,pose,dark).map(([t,a])=>'<'+t+' '+Object.keys(a).map(k=>k+'="'+fmtA(a[k])+'"').join(' ')+'/>').join('')+'</svg>';
}
function poseAt(ex,ms){
  const f=ex.f, seq=ex.seq||[0,1], seg=ex.dur||1200;
  const nSeg = ex.jump ? seq.length-1 : seq.length;
  const t=(Math.max(0,ms)/seg)%nSeg, i=Math.floor(t); let u=t-i;
  const hold=ex.hold??0.18; u=Math.min(1,Math.max(0,(u-hold/2)/(1-hold)));
  u=0.5-0.5*Math.cos(Math.PI*u);
  const a=f[seq[i]], b=f[seq[(i+1)%seq.length]];
  return lerp(a,b,u);
}
const NS='http://www.w3.org/2000/svg';
const ANIMS=new Set();
function buildNodes(a,shapes){
  a.el.innerHTML=''; const svg=document.createElementNS(NS,'svg'); svg.setAttribute('viewBox','0 0 240 210');
  a.nodes=shapes.map(([t,at])=>{const n=document.createElementNS(NS,t); for(const k in at) n.setAttribute(k,fmtA(at[k])); svg.appendChild(n); return n;});
  a.el.appendChild(svg);
}
function mountAnim(el,exId,dark){ const ex=EX[exId]; if(!ex) return; const a={el,ex,dark,t0:performance.now()-Math.random()*300,nodes:null}; buildNodes(a,figureShapes(ex,ex.f[0],dark)); ANIMS.add(a); }
(function loop(now){
  ANIMS.forEach(a=>{
    if(!a.el.isConnected){ANIMS.delete(a);return;}
    try{
      const sh=figureShapes(a.ex,poseAt(a.ex,now-a.t0),a.dark,now-a.t0);
      if(!a.nodes||a.nodes.length!==sh.length) return buildNodes(a,sh);
      sh.forEach(([t,at],i)=>{const n=a.nodes[i]; for(const k in at){ if(typeof at[k]==='number') n.setAttribute(k,k==='opacity'?at[k].toFixed(2):at[k].toFixed(1)); }});
    }catch(e){ANIMS.delete(a);}
  });
  requestAnimationFrame(loop);
})(performance.now());

const PHASES=[
 {n:'Inicio',from:1,to:4,sets:2,reps:8,rest:60,cw:30,cr:30,rounds:2,walk:15,desc:'Conocer los ejercicios y crear el hábito. Debe sentirse como un esfuerzo moderado, nunca con dolor.'},

function phaseIdx(week){ const o=S.settings.phaseOverride; if(o!=null&&o!=='') return +o; return Math.max(0,PHASES.findIndex(p=>week>=p.from&&week<=p.to)); }
function wk(){ const d=daysBetween(S.profile.start,todayStr()); return Math.min(52,Math.max(1,Math.floor(d/7)+1)); }
function workout(id,pi,week){
  const P=PHASES[pi];
  const str=(list)=>({type:'sets',items:list.map(e=>({ex:e,sets:P.sets,reps:P.reps,secs:0,rest:P.rest}))});
  if(id==='A') return Object.assign({id,n:'Piernas y equilibrio'},str(['pierna_frente','pierna_atras','talones','bisagra']));
  if(id==='B') return Object.assign({id,n:'Brazo y tronco'},str(['empuje_pared','curl1','press1','frontal1','talones']));
  if(id==='C') return {id,n:'Cardio de pie · Circuito',type:'circuit',items:['marcha_recta','boxeo1','talones','caminar_rigido'].map(e=>({ex:e})),work:P.cw,rest:P.cr,rounds:P.rounds,roundRest:75};
  if(id==='W') return {id,n:'Caminata',type:'intervals',items:[{ex:'caminar_rigido',secs:P.walk*60,label:'Caminata a paso firme'}]};

function scheduleFor(pi,week){ // índice 0=lunes · igual en las dos apps para entrenar juntos
  const fri= week%2 ? 'A':'B';

}
function steps(w){
  const out=[]; const push=(o)=>out.push(o);
  WARMUP.forEach(([e,s])=>push({k:'work',ex:e,secs:s,tag:'Calentamiento'}));
  push({k:'rest',secs:20,tag:'Prepárate'});
  if(w.type==='sets'){
    w.items.forEach((it,i)=>{ for(let s=1;s<=it.sets;s++){
      push({k:'work',ex:it.ex,reps:it.reps,secs:it.secs,set:s,sets:it.sets,tag:'Serie '+s+' de '+it.sets});
      const last = i===w.items.length-1 && s===it.sets; if(!last) push({k:'rest',secs:it.rest,tag:'Descanso'});
    }});
  } else if(w.type==='circuit'){
    for(let r=1;r<=w.rounds;r++){ w.items.forEach((it,i)=>{
      push({k:'work',ex:it.ex,secs:w.work,tag:'Ronda '+r+' de '+w.rounds});
      const lastInRound=i===w.items.length-1;
      if(!lastInRound) push({k:'rest',secs:w.rest,tag:'Descanso'});
      else if(r<w.rounds) push({k:'rest',secs:w.roundRest,tag:'Fin de ronda '+r});
    });}
  } else {
    w.items.forEach(it=>push({k:'work',ex:it.ex,secs:it.secs,tag:it.label}));
  }
  COOLDOWN.forEach(([e,s])=>push({k:'work',ex:e,secs:s,tag:'Vuelta a la calma: camina suave y respira'}));
  return out;
}
function estMin(w){ return Math.round(steps(w).reduce((a,s)=>a+(s.secs||(s.reps?(s.reps*(EX[s.ex].side?2:1)*3.5):0)),0)/60); }

/* ===== Fondos con shaders (Seda, Aurora, Líquido) en blanco y negro ===== */
const SH=(()=>{const el=document.getElementById('bgsh');let m=null,noise=null;
  function cfg(k,d){const P=window.PaperShaders,C=P.getShaderColorFromString,F=P.ShaderFitOptions,OS=P.defaultObjectSizing,PS=P.defaultPatternSizing;
    const sz=s=>({u_fit:F[s.fit],u_rotation:s.rotation,u_scale:s.scale,u_offsetX:s.offsetX,u_offsetY:s.offsetY,u_originX:s.originX,u_originY:s.originY,u_worldWidth:s.worldWidth,u_worldHeight:s.worldHeight});
    if(k==='seda'){const c=d?['#000000','#2b2b2b','#6e6e6e','#151515']:['#ffffff','#d6d6d6','#9a9a9a','#efefef'];
      return[P.meshGradientFragmentShader,{u_colors:c.map(C),u_colorsCount:c.length,u_distortion:.82,u_swirl:.28,u_grainMixer:0,u_grainOverlay:0,...sz({...OS,fit:'cover'})},.35]}
    if(k==='aurora'){const c=d?['#050505','#4a4a4a','#1f1f1f','#7a7a7a','#2e2e2e']:['#fafafa','#bdbdbd','#e6e6e6','#8f8f8f','#d0d0d0'];
      return[P.meshGradientFragmentShader,{u_colors:c.map(C),u_colorsCount:c.length,u_distortion:1,u_swirl:.6,u_grainMixer:.18,u_grainOverlay:d?.12:.16,...sz({...OS,fit:'cover'})},.8]}
    const c=d?['#0d0d0d','#5a5a5a','#1c1c1c','#3a3a3a']:['#f2f2f2','#bfbfbf','#e0e0e0','#9e9e9e'];
    return[P.warpFragmentShader,{u_colors:c.map(C),u_colorsCount:c.length,u_proportion:.45,u_softness:1,u_distortion:.25,u_swirl:.8,u_swirlIterations:10,u_shapeScale:.1,u_shape:P.WarpPatterns.checks,u_noiseTexture:noise,...sz(PS)},3]}
  function montar(){if(m){try{m.dispose()}catch(_){}m=null}if(!el)return;el.innerHTML='';const k=document.documentElement.dataset.fx,P=window.PaperShaders;
    if(!['seda','aurora','liquido'].includes(k)||!P)return;
    if(!noise)noise=P.getShaderNoiseTexture();if(!noise.complete){noise.addEventListener('load',montar,{once:true});return}
    try{const[fs,u,sp]=cfg(k,isDark());const quieto=matchMedia('(prefers-reduced-motion: reduce)').matches;
      m=new P.ShaderMount(el,fs,u,undefined,quieto?0:sp,0,1,1200000);const orig=m.render;let last=0;
      m.render=t=>{if((typeof PL!=='undefined'&&PL)||document.hidden){m.rafId=requestAnimationFrame(m.render);return}if((localStorage.getItem('fps')||'60')==='30'&&t-last<30){m.rafId=requestAnimationFrame(m.render);return}last=t;orig(t)}}catch(e){el.innerHTML=''}}
  return{montar}})();

function drawChart(){
  const all=sortedW(), t=todayStr(); if(!all.length){$('#chart').innerHTML='';return;}
  let from=all[0].d; if(range==='1m'){const d=new Date();d.setMonth(d.getMonth()-1);from=ds(d);} if(range==='3m'){const d=new Date();d.setMonth(d.getMonth()-3);from=ds(d);}
  const W=all.filter(e=>e.d>=from); const pts=W.length?W:[all[all.length-1]];
  const x0=parse(pts[0].d<from?pts[0].d:from); let x1=parse(t>pts[pts.length-1].d?t:pts[pts.length-1].d);
  if(range==='todo'){ const e=parse(S.profile.start); e.setDate(e.getDate()+365); if(e>x1) x1=e; }
  const span=Math.max(7*864e5,x1-x0);
  const st=S.profile.startWeight, g=S.profile.goal, s0=S.profile.start;
  const planAt=d=>{const k=daysBetween(s0,ds(d))/365; return st-(st-g)*Math.max(0,Math.min(1,k));};
  let ys=pts.map(p=>p.w).concat([planAt(x0),planAt(x1)]); if(range==='todo') ys.push(g);
  let lo=Math.min(...ys)-1.5, hi=Math.max(...ys)+1.5;
  const Wd=340,H=200,pl=34,pr=8,pt=10,pb=22;
  const X=d=>pl+(Wd-pl-pr)*((d-x0)/span), Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let s='';
  const ticks=5; for(let i=0;i<=ticks;i++){const v=lo+(hi-lo)*i/ticks; s+=`<line x1="${pl}" x2="${Wd-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#8884"/><text x="${pl-4}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="#888">${Math.round(v)}</text>`;}
  s+=`<text x="${pl}" y="${H-6}" font-size="10" fill="#888">${fmtD(ds(x0))} ${String(x0.getFullYear()).slice(2)}</text><text x="${Wd-pr}" y="${H-6}" font-size="10" fill="#888" text-anchor="end">${fmtD(ds(x1))} ${String(x1.getFullYear()).slice(2)}</text>`;
  if(g>=lo&&g<=hi) s+=`<line x1="${pl}" x2="${Wd-pr}" y1="${Y(g)}" y2="${Y(g)}" stroke="currentColor" stroke-dasharray="6 4"/><text x="${Wd-pr}" y="${Y(g)-4}" font-size="10" text-anchor="end" fill="currentColor">meta</text>`;
  const pa=[]; for(let i=0;i<=30;i++){const d=new Date(+x0+span*i/30); pa.push(X(d).toFixed(1)+','+Y(planAt(d)).toFixed(1));} s+=`<polyline points="${pa.join(' ')}" fill="none" stroke="#aaa" stroke-width="2" stroke-dasharray="2 4"/>`;
  s+=`<polyline points="${pts.map(p=>X(parse(p.d)).toFixed(1)+','+Y(p.w).toFixed(1)).join(' ')}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach(p=>s+=`<circle cx="${X(parse(p.d)).toFixed(1)}" cy="${Y(p.w).toFixed(1)}" r="3.5" fill="currentColor"/>`);
  $('#chart').innerHTML=`<svg viewBox="0 0 ${Wd} ${H}" style="width:100%;display:block">${s}</svg>`;
}

let PL=null, AC=null, wakeLock=null;
function beep(n=1,f=880){ if(!S.settings.sound||!AC) return; for(let i=0;i<n;i++){ const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=f; o.connect(g); g.connect(AC.destination); const t=AC.currentTime+i*0.22; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.4,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.18); o.start(t); o.stop(t+0.2);} try{navigator.vibrate&&navigator.vibrate(n>1?[150,80,150]:120);}catch(e){} }
async function lockScreen(){ try{ if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(PL&&document.visibilityState==='visible') lockScreen(); });
function startPlayer(w){
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); AC.resume(); }catch(e){}
  lockScreen();
  PL={w,st:steps(w),i:0,t0:Date.now(),end:0,paused:false,left:0,timer:null};
  $('#player').classList.remove('hide'); document.body.style.overflow='hidden';
  goStep(0);
}
function tap(el,fn){
  if(!el) return; let last=0, sx=0, sy=0;
  el.addEventListener('touchstart',e=>{const t=e.changedTouches[0]; sx=t.clientX; sy=t.clientY;},{passive:true});
  el.addEventListener('touchend',e=>{const t=e.changedTouches[0]; if(Math.abs(t.clientX-sx)>20||Math.abs(t.clientY-sy)>20) return; e.preventDefault(); last=Date.now(); fn(el);},{passive:false});
  el.addEventListener('click',()=>{ if(Date.now()-last<700) return; fn(el); });
}
function goStep(i){
  clearInterval(PL.timer);
  if(i>=PL.st.length) return finish();
  PL.i=Math.max(0,i); const s=PL.st[PL.i]; PL.paused=false;
  PL.end= s.secs ? Date.now()+s.secs*1000 : 0;
  drawStep();
  if(s.secs){ PL.timer=setInterval(tick,250); }
}
function tick(){
  if(PL.paused) return; const s=PL.st[PL.i]; const left=Math.ceil((PL.end-Date.now())/1000);
  const el=$('#pT'); if(el) el.textContent=fmtS(Math.max(0,left));
  if(left<=3&&left>0&&left!==PL.lastB){PL.lastB=left; beep(1,660);}
  if(left<=0){ beep(s.k==='rest'?2:3, s.k==='rest'?990:880); goStep(PL.i+1); }
}
const fmtS=s=>s>=60?Math.floor(s/60)+':'+pad(s%60):String(s);
function nextWork(from){ for(let j=from;j<PL.st.length;j++) if(PL.st[j].k==='work') return PL.st[j]; return null; }
function drawStep(){
  const s=PL.st[PL.i], P=$('#player'), rest=s.k==='rest', pr=(PL.i/PL.st.length*100).toFixed(1);
  P.classList.toggle('rest',rest);
  const show = rest ? nextWork(PL.i+1) : s; const x=show?EX[show.ex]:null;
  let target;
  if(rest) target=`<div class="tgt" id="pT">${fmtS(s.secs)}</div>`;
  else if(s.reps) target=`<div class="tgt">${s.reps}<span style="font-size:22px;letter-spacing:0"> reps${x.side?' por lado':''}</span></div>`;
  else target=`<div class="tgt" id="pT">${fmtS(s.secs)}</div>`;
  P.innerHTML=`
   <div class="top"><button class="x" id="pX" style="color:inherit">✕</button><div class="small"><b>${esc(PL.w.n)}</b></div><div class="small mut">${PL.i+1}/${PL.st.length}</div></div>
   <div class="prog"><i style="width:${pr}%"></i></div>
   <div class="stage">
    <div class="mut small" style="margin-bottom:6px">${rest?(esc(s.tag)+(x?' · Sigue: <b>'+x.n+'</b>':'')):esc(s.tag||'')}</div>
    <div class="anim" id="pA"></div>
    <h2>${rest?(s.tag==='Prepárate'?'Prepárate':'Descansa'):x.n}</h2>${!rest&&x&&x.m?`<div class="small" style="color:#ff5a2a;font-weight:600">🔥 Trabaja: ${musc(x)}</div>`:''}
    ${target}
    ${!rest&&x?`<ul class="cues">${x.c.map(c=>`<li>${c}</li>`).join('')}</ul>`:''}
   </div>
   <div class="ctr">
    <button class="btn w" id="pB" style="flex:0 0 64px">‹</button>
    ${rest?`<button class="btn w" id="p15" style="flex:0 0 80px">+15s</button><button class="btn" id="pN">Saltar</button>`
     : s.reps?`<button class="btn" id="pN">Hecho ✓</button>`:`<button class="btn w" id="pP" style="flex:0 0 96px">Pausa</button><button class="btn" id="pN">Siguiente</button>`}
   </div>`;
  if(x) mountAnim($('#pA'),show.ex,rest?!isDark():isDark()); else $('#pA').classList.add('hide');
  const my=PL.i;
  tap($('#pX'),()=>{ if(confirm('¿Salir del entrenamiento? No se guardará.')) closePlayer(); });
  tap($('#pB'),()=>{ if(PL&&PL.i===my) goStep(my-1); });
  tap($('#pN'),()=>{ if(PL&&PL.i===my) goStep(my+1); });
  tap($('#p15'),()=>{PL.end+=15000; tick();});
  tap($('#pP'),b=>{ if(!PL.paused){PL.paused=true;PL.left=PL.end-Date.now();b.textContent='Seguir';} else {PL.paused=false;PL.end=Date.now()+PL.left;b.textContent='Pausa';} });
}
function finish(){
  clearInterval(PL.timer); beep(3,1046);
  const mins=Math.max(1,Math.round((Date.now()-PL.t0)/60000)); let rate='';
  const P=$('#player'); P.classList.remove('rest');
  P.innerHTML=`<div class="stage"><div style="font-size:64px">🏁</div><h2>¡Entrenamiento completo!</h2><p class="mut">${esc(PL.w.n)} · ${mins} min</p>
   <p style="margin:18px 0 0"><b>¿Cómo lo sentiste?</b></p>
   <div class="rate" style="width:100%">${['Fácil','Bien','Muy duro'].map(r=>`<button data-r="${r}">${r}</button>`).join('')}</div>
   <p class="small mut" id="rMsg" style="min-height:40px"></p></div>
   <button class="btn" id="pSave">Guardar</button>`;
  P.querySelectorAll('.rate button').forEach(b=>tap(b,()=>{ rate=b.dataset.r; P.querySelectorAll('.rate button').forEach(x=>x.classList.toggle('on',x===b));
    $('#rMsg').textContent= rate==='Fácil'?'Bien. Si se repite varias veces, haz cada repetición más lenta y controlada; la fase subirá sola con las semanas.'
      : rate==='Muy duro'?'Ok. Si se repite, puedes quedarte en la fase anterior desde Ajustes. Descansa y duerme bien.':'Perfecto, esa es la intensidad que buscamos.'; }));
  let saved=false; tap($('#pSave'),()=>{ if(saved) return; saved=true; S.sessions.push({d:todayStr(),id:PL.w.id,n:PL.w.n,mins,rate}); save(); closePlayer(); tab='inicio'; render(); });
}
function closePlayer(){ clearInterval(PL&&PL.timer); PL=null; $('#player').classList.add('hide'); $('#player').innerHTML=''; document.body.style.overflow=''; try{wakeLock&&wakeLock.release();}catch(e){} }


/* =========================================================
   FONDO ANIMADO
   ========================================================= */
const BG=(()=>{
  const cv=document.getElementById('bgfx'), ctx=cv.getContext('2d');
  let W=0,H=0,dpr=1,parts=[],last=0,running=false;
  const mode=()=>document.documentElement.dataset.fx||'ondas';
  const reduce=matchMedia('(prefers-reduced-motion: reduce)');
  function size(){ dpr=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); seed(); draw(performance.now()); }
  function seed(){
    const m=mode(); parts=[];
    if(m==='constelacion'){ const n=Math.round(Math.min(60,W*H/9000)); for(let i=0;i<n;i++) parts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,r:1+Math.random()*1.6}); }
    if(m==='pesas'){ const n=Math.round(Math.min(16,W*H/26000)); for(let i=0;i<n;i++) parts.push({x:Math.random()*W,y:Math.random()*H,v:.12+Math.random()*.25,a:Math.random()*6.28,va:(Math.random()-.5)*.006,s:.6+Math.random()*.9}); }
  }
  const ink=a=>(document.documentElement.dataset.theme==='dark'?`rgba(255,255,255,${a})`:`rgba(0,0,0,${a})`);
  function dumbbell(x,y,a,s,c){
    ctx.save(); ctx.translate(x,y); ctx.rotate(a); ctx.scale(s,s); ctx.fillStyle=c;
    const rr=(x,y,w,h,r)=>{ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h); ctx.fill();};
    rr(-14,-1.6,28,3.2,1.6); rr(-13,-8,5,16,2); rr(8,-8,5,16,2); rr(-17,-5.5,3.5,11,1.5); rr(13.5,-5.5,3.5,11,1.5);
    ctx.restore();
  }
  function draw(now,k=1){
    ctx.clearRect(0,0,W,H); const m=mode(), t=now/1000;
    if(m==='ondas'){
      for(let k=0;k<5;k++){
        ctx.beginPath(); const base=H*(.12+k*.2), amp=18+k*7, f=.006-k*.0006, sp=.25+k*.08;
        for(let x=0;x<=W+10;x+=8){ const y=base+Math.sin(x*f+t*sp+k*1.3)*amp+Math.sin(x*f*2.1-t*sp*.7)*amp*.35; x?ctx.lineTo(x,y):ctx.moveTo(x,y); }
        ctx.strokeStyle=ink(.22+k*.05); ctx.lineWidth=2.2; ctx.stroke();
      }
    } else if(m==='constelacion'){
      for(const p of parts){ p.x+=p.vx*k; p.y+=p.vy*k; if(p.x<-10)p.x=W+10; if(p.x>W+10)p.x=-10; if(p.y<-10)p.y=H+10; if(p.y>H+10)p.y=-10; }
      ctx.lineWidth=1;
      for(let i=0;i<parts.length;i++) for(let j=i+1;j<parts.length;j++){ const a=parts[i],b=parts[j],d=Math.hypot(a.x-b.x,a.y-b.y); if(d<110){ ctx.strokeStyle=ink(.28*(1-d/110)); ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); } }
      ctx.fillStyle=ink(.45); for(const p of parts){ ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill(); }
    } else if(m==='pesas'){
      for(const p of parts){ p.y-=p.v*k; p.a+=p.va*k; p.x+=Math.sin(t*.4+p.s*5)*.12*k; if(p.y<-30){p.y=H+30;p.x=Math.random()*W;} dumbbell(p.x,p.y,p.a,p.s*1.3,ink(.16+p.s*.06)); }
    }
  }
  function loop(now){
    if(!running) return;
    const busy = document.hidden || (typeof PL!=='undefined' && PL) || mode()==='none';
    const iv=(localStorage.getItem('fps')||'60')==='60'?12:33;
    if(!busy && now-last>iv){ const k=Math.min(2,(now-last)/33.3); last=now; draw(now,k); }
    requestAnimationFrame(loop);
  }
  function start(){ if(running) return; running=true; requestAnimationFrame(loop); }
  function set(m){ document.documentElement.dataset.fx=m; try{localStorage.setItem('fondo',m);}catch(e){} seed(); ctx.clearRect(0,0,W,H); if(m!=='none') draw(performance.now()); try{SH.montar()}catch(e){} }
  addEventListener('resize',size);
  size(); if(!reduce.matches) start();
  return {set,mode,redraw:()=>draw(performance.now())};
})();
(function(){const sh=document.getElementById('sheet');if(!sh)return;let y0=null,dy=0;
  sh.addEventListener('touchstart',e=>{if(sh.scrollTop>2){y0=null;return}y0=e.touches[0].clientY;dy=0;sh.style.transition='none'},{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0){sh.style.transform='translateY('+dy+'px)';if(e.cancelable)e.preventDefault()}else{sh.style.transform=''}},{passive:false});
  sh.addEventListener('touchend',()=>{if(y0==null)return;sh.style.transition='transform .25s ease';if(dy>110){sh.style.transform='translateY(110%)';setTimeout(()=>{closeModal();sh.style.transform='';sh.style.transition=''},230)}else sh.style.transform='';y0=null});})();
render();try{SH.montar()}catch(e){}
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
