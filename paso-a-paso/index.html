<style>
:root{--bg:#fff;--fg:#0a0a0a;--mut:#6b6b6b;--mut2:#aaa;--line:#e4e4e4;--line2:#ccc;--soft:#f4f4f4;--card:#fff;--seg:#e9e9e9;--bar:#ddd;--barinv:#333;--restanim:#1a1a1a;--r:16px;color-scheme:light}

nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}

.card.dark{background:var(--fg);color:var(--bg)}
.card h2{margin:0 0 8px;font-size:17px}
.card h3{margin:0 0 6px;font-size:15px}
.mut{color:var(--mut)}.dark .mut{color:var(--mut2)}
.small{font-size:13px}
.big{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1}

.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.bar{height:10px;background:var(--bar);border-radius:99px;overflow:hidden}
.dark .bar{background:var(--barinv)}

label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1.5px solid var(--line2);border-radius:12px;background:var(--card);color:var(--fg)}

#player{position:fixed;top:0;left:0;right:0;height:100vh;height:100dvh;z-index:20;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom));overflow:hidden}
#player.rest{background:var(--fg);color:var(--bg)}

#player.rest .prog i{background:var(--bg)}
#player .stage{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0;overflow:hidden}

#player.rest .anim{background:var(--restanim)}
#player h2{margin:12px 0 2px;font-size:24px}

#player .ctr{display:flex;gap:10px;margin-top:12px;flex:none;position:relative;z-index:2}
#player .ctr .btn{flex:1}
#player.rest .btn{background:var(--bg);color:var(--fg)}
#player.rest .btn.w{background:var(--fg);color:var(--bg);border-color:var(--bg)}
.rate{display:flex;gap:8px;margin:14px 0}
.rate button{flex:1;padding:14px 6px;border:2px solid var(--fg);background:var(--bg);color:var(--fg);border-radius:12px;font:inherit;font-weight:700}
.rate button.on{background:var(--fg);color:var(--bg)}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.modal .sheet{background:var(--bg);color:var(--fg);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}

#bgfx{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
main{position:relative;z-index:1}
html[data-fx]:not([data-fx=none]) .card{background:var(--softA);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
html[data-fx]:not([data-fx=none]) .card.dark{background:var(--fg)}
:root{--softA:rgba(244,244,244,.66)}
html[data-theme=dark]{--softA:rgba(24,24,24,.62)}
</style>

<body>
<header><h1>PASO A PASO</h1><div class="hr"><span class="badge" id="wkBadge"></span><button id="thBtn" aria-label="Claro / Nocturno"></button></div></header>
<canvas id="bgfx" aria-hidden="true"></canvas>
<main id="view"></main>
<nav id="nav">
 <button data-t="inicio" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
 <button data-t="entrenar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Entrenar</button>
 <button data-t="progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Progreso</button>
 <button data-t="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Ajustes</button>
</nav>

<div id="modal" class="modal hide"><div class="sheet" id="sheet"></div></div>

<script>
/* =========================================================
   ANIMACIONES (figura de palitos, vista lateral)
   ========================================================= */
const D2R = Math.PI/180;
const dir = (a,l)=>[Math.sin(a*D2R)*l, Math.cos(a*D2R)*l];
const add = (p,q)=>[p[0]+q[0],p[1]+q[1]];
const LEN = {torso:52, ua:27, fa:25, th:36, sh:36, foot:11};
function ik(S,T,a,b,k){
  const dx=T[0]-S[0], dy=T[1]-S[1];
  let d=Math.hypot(dx,dy); d=Math.max(Math.abs(a-b)+0.5, Math.min(a+b-0.01,d));
  const base=Math.atan2(dy,dx), off=Math.acos((a*a+d*d-b*b)/(2*a*d));
  const ang=base-k*off, J=[S[0]+a*Math.cos(ang), S[1]+a*Math.sin(ang)];
  const a2=Math.atan2(T[1]-J[1],T[0]-J[0]);
  return [J,[J[0]+b*Math.cos(a2), J[1]+b*Math.sin(a2)]];
}
function limb(S,sp,a,b){
  if(sp.t) return ik(S,sp.t,a,b,sp.k||1);
  const J=add(S,dir(sp.a,a)); return [J, add(J,dir(sp.b,b))];
}
function solve(p){
  const hip=p.hip;
  let ta=p.torso;
  if(p.neck){ ta=Math.atan2(p.neck[0]-hip[0], p.neck[1]-hip[1])/D2R; }
  const neck=add(hip,dir(ta,LEN.torso)), sho=add(hip,dir(ta,LEN.torso-5)), head=add(hip,dir(ta,LEN.torso+14));
  const arms=p.arms.map(s=>limb(sho,s,LEN.ua,LEN.fa));
  const legs=p.legs.map(s=>{const r=limb(hip,s,LEN.th,LEN.sh); r.push(add(r[1],dir(s.f??90,LEN.foot))); return r;});
  return {hip,neck,sho,head,arms,legs};
}
function lerp(a,b,t){
  if(typeof a==='number') return a+(b-a)*t;
  if(Array.isArray(a)) return a.map((v,i)=>lerp(v,b[i],t));
  if(a&&typeof a==='object'){const o={}; for(const k in a) o[k]=(k==='k')?a[k]:lerp(a[k],b[k],t); return o;}
  return a;
}
const ln=(p,q,c,w)=>['line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:c,'stroke-width':w,'stroke-linecap':'round'}];
function chair(x,y,back){ // asiento de x a x+40 a la altura y
  const c='#9a9a9a'; const bx= back==='L'?x:x+40;
  return [ln([x,y],[x+40,y],c,4),ln([x+3,y],[x+3,200],c,3),ln([x+37,y],[x+37,200],c,3),ln([bx,y],[bx,y-46],c,4)];
}
function props(list,dark){
  const out=[], fill=dark?'#2c2c2c':'#e6e6e6', st=dark?'#666':'#b5b5b5';
  (list||[]).forEach(p=>{
    if(p==='chairBack') out.push(...chair(58,168,'L'));
    if(p==='chairFront') out.push(...chair(156,168,'R'));
    if(p==='chairSeat') out.push(...chair(82,166,'L'));
    if(p==='counter') out.push(['rect',{x:188,y:150,width:60,height:50,fill,stroke:st,'stroke-width':2}]);
    if(p==='wall') out.push(['rect',{x:184,y:20,width:12,height:180,fill,stroke:st,'stroke-width':2}]);
    if(p==='mat') out.push(['rect',{x:28,y:198,width:190,height:4,rx:2,fill:dark?'#3a3a3a':'#cfcfcf'}]);
  });
  return out;
}
function figureShapes(ex,pose,dark){
  const F=solve(pose), fg=dark?'#f2f2f2':'#0a0a0a', bk=dark?'#6d6d6d':'#a8a8a8', W=7, hole=dark?'#000':'#fff';
  const w=ex.w, sh=[ln([0,201],[240,201],dark?'#444':'#d0d0d0',2), ...props(ex.props,dark)];
  const db=(p,c)=>{sh.push(['circle',{cx:p[0],cy:p[1],r:6.5,fill:c}]); sh.push(['circle',{cx:p[0],cy:p[1],r:2.2,fill:hole}]);};
  const limbS=(L,c,isLeg)=>{sh.push(ln(isLeg?F.hip:F.sho,L[0],c,W), ln(L[0],L[1],c,W)); if(isLeg) sh.push(ln(L[1],L[2],c,W-1));};
  limbS(F.legs[1],bk,1);
  sh.push(ln(F.hip,F.neck,fg,W+2), ['circle',{cx:F.head[0],cy:F.head[1],r:10.5,fill:fg}]);
  limbS(F.legs[0],fg,1); limbS(F.arms[0],fg,0);
  if(w===true||(Array.isArray(w)&&w[0])) db(F.arms[0][1],fg);
  if(w==='goblet'){const m=lerp(F.arms[0][1],F.arms[1][1],.5); sh.push(['rect',{x:m[0]-6,y:m[1]-11,width:12,height:22,rx:4,fill:fg}]);}
  return sh;
}
const fmtA=v=>typeof v==='number'?v.toFixed(1):v;
function figureSVG(ex,pose,dark){
  return '<svg viewBox="0 0 240 210" xmlns="http://www.w3.org/2000/svg">'+figureShapes(ex,pose,dark).map(([t,a])=>'<'+t+' '+Object.keys(a).map(k=>k+'="'+fmtA(a[k])+'"').join(' ')+'/>').join('')+'</svg>';
}
function poseAt(ex,ms){
  const f=ex.f, seq=ex.seq||[0,1], seg=ex.dur||1200;
  const nSeg = ex.jump ? seq.length-1 : seq.length;
  const t=(Math.max(0,ms)/seg)%nSeg, i=Math.floor(t); let u=t-i;
  const hold=ex.hold??0.18; u=Math.min(1,Math.max(0,(u-hold/2)/(1-hold)));
  u=0.5-0.5*Math.cos(Math.PI*u);
  const a=f[seq[i]], b=f[seq[(i+1)%seq.length]];
  return lerp(a,b,u);
}
const NS='http://www.w3.org/2000/svg';
const ANIMS=new Set();
function buildNodes(a,shapes){
  a.el.innerHTML=''; const svg=document.createElementNS(NS,'svg'); svg.setAttribute('viewBox','0 0 240 210');
  a.nodes=shapes.map(([t,at])=>{const n=document.createElementNS(NS,t); for(const k in at) n.setAttribute(k,fmtA(at[k])); svg.appendChild(n); return n;});
  a.el.appendChild(svg);
}
function mountAnim(el,exId,dark){ const ex=EX[exId]; if(!ex) return; const a={el,ex,dark,t0:performance.now()-Math.random()*300,nodes:null}; buildNodes(a,figureShapes(ex,ex.f[0],dark)); ANIMS.add(a); }
(function loop(now){
  ANIMS.forEach(a=>{
    if(!a.el.isConnected){ANIMS.delete(a);return;}
    try{
      const sh=figureShapes(a.ex,poseAt(a.ex,now-a.t0),a.dark);
      if(!a.nodes||a.nodes.length!==sh.length) return buildNodes(a,sh);
      sh.forEach(([t,at],i)=>{const n=a.nodes[i]; for(const k in at){ if(typeof at[k]==='number') n.setAttribute(k,at[k].toFixed(1)); }});
    }catch(e){ANIMS.delete(a);}
  });
  requestAnimationFrame(loop);
})(performance.now());

/* ---------- Biblioteca de ejercicios (rodillas siempre estiradas) ---------- */
// El segundo brazo no se dibuja (HIDE_ARM2).
const RC=(t=180)=>({a:15+(t-180),b:150+(t-180)});
const ST=(o)=>Object.assign({hip:[120,128],torso:180,arms:[{a:6,b:6},RC()],legs:[{a:0,b:0,f:90},{a:-1,b:-1,f:90}]},o);
const EX={
 caminar_rigido:{n:'Caminata',u:'secs',dur:480,hold:0,seq:[0,1,2,1],
  c:['Pasos cortos y seguros.','Mira al frente, no a los pies.','Puedes hablar, pero con algo de esfuerzo.'],
  f:[ST({hip:[120,131.5],arms:[{a:-20,b:-10},RC()],legs:[{a:18,b:18,f:90},{a:-18,b:-18,f:90}]}),
     ST({hip:[120,128],arms:[{a:2,b:6},RC()]}),
     ST({hip:[120,131.5],arms:[{a:25,b:40},RC()],legs:[{a:-18,b:-18,f:90},{a:18,b:18,f:90}]})]},
 marcha_recta:{n:'Marcha con piernas rectas',u:'secs',dur:600,hold:.05,
  c:['Junto a un mueble firme por si necesitas apoyo.','Levanta una pierna estirada un poco hacia adelante, luego la otra.','Mueve el brazo derecho al ritmo.'],
  f:[ST({arms:[{a:-25,b:-10},RC()],legs:[{a:24,b:24,f:90},{a:-1,b:-1,f:90}]}), ST({arms:[{a:30,b:60},RC()],legs:[{a:0,b:0,f:90},{a:24,b:24,f:90}]})]},
 boxeo1:{n:'Golpes al aire',u:'secs',dur:380,hold:.05,
  c:['Pies separados, firmes en el suelo.','Golpea al frente con el brazo derecho y vuelve a la guardia.','Ritmo rápido pero controlado.'],
  f:[ST({hip:[120,129.1],torso:178,arms:[{a:25,b:160},RC(178)],legs:[{a:10,b:10,f:90},{a:-10,b:-10,f:90}]}),
     ST({hip:[120,129.1],torso:174,arms:[{a:84,b:86},RC(174)],legs:[{a:10,b:10,f:90},{a:-10,b:-10,f:90}]})]},
 circulos_brazo:{n:'Círculos de brazo',u:'secs',dur:450,hold:0,jump:true,seq:[0,1,2,3,4],
  c:['Brazo derecho estirado.','Círculos grandes y lentos hacia adelante.','Respira profundo.'],
  f:[0,90,180,270,360].map(A=>ST({arms:[{a:A,b:A},RC()]}))},
 pierna_frente:{n:'Pierna recta al frente',u:'reps',side:1,dur:1500,
  c:['Apóyate con la mano derecha en un mueble firme a tu lado.','Sube la pierna estirada hacia adelante, sin balancearte.','Baja lento. Luego cambia de pierna.'],
  f:[ST({}), ST({torso:182,legs:[{a:28,b:28,f:90},{a:-1,b:-1,f:90}]})]},
 pierna_atras:{n:'Pierna recta atrás',u:'reps',side:1,dur:1500,
  c:['Apóyate con la mano derecha en un mueble firme.','Lleva la pierna estirada hacia atrás apretando el glúteo.','Espalda recta, sin arquearla.'],
  f:[ST({}), ST({torso:173,arms:[{a:2,b:2},RC(173)],legs:[{a:-24,b:-24,f:90},{a:-1,b:-1,f:90}]})]},
 talones:{n:'Elevación de talones',u:'reps',dur:1200,
  c:['Apóyate en un mueble firme.','Sube en punta de pies.','Baja lento los talones.'],
  f:[ST({}), ST({hip:[120,120],legs:[{a:0,b:0,f:43},{a:-1,b:-1,f:43}]})]},
 bisagra:{n:'Inclinación de cadera',u:'reps',dur:1600,
  c:['Piernas estiradas, mano derecha apoyada en el muslo.','Inclina el tronco adelante llevando la cadera atrás, espalda recta.','Solo hasta donde sientas estirar atrás de los muslos. Sube lento.'],
  f:[ST({legs:[{t:[122,200],k:1,f:90},{t:[118,200],k:1,f:90}]}),
     ST({hip:[109.5,129.1],torso:138,arms:[{a:-22,b:-30},RC(138)],legs:[{t:[122,200],k:1,f:90},{t:[118,200],k:1,f:90}]})]},
 curl1:{n:'Curl de bíceps',u:'reps',w:[1,0],dur:1200,

/* =========================================================
   PLAN DE 1 AÑO (52 semanas, 4 fases, intensidad moderada)
   ========================================================= */
const PHASES=[
 {n:'Inicio',from:1,to:4,sets:2,reps:8,rest:60,cw:30,cr:30,rounds:2,walk:15,desc:'Conocer los ejercicios y crear el hábito. Debe sentirse como un esfuerzo moderado, nunca con dolor.'},
 {n:'Adaptación',from:5,to:12,sets:3,reps:10,rest:60,cw:30,cr:30,rounds:3,walk:20,desc:'Una serie más y caminatas más largas.'},
 {n:'Progreso',from:13,to:28,sets:3,reps:12,rest:45,cw:40,cr:20,rounds:3,walk:30,desc:'Más repeticiones y menos descanso.'},
 {n:'Constancia',from:29,to:52,sets:3,reps:15,rest:45,cw:40,cr:20,rounds:4,walk:40,desc:'Mantener el ritmo y sostener lo logrado.'},
];
const WARMUP=[['marcha_recta',60],['circulos_brazo',30],['talones',30]];
const COOLDOWN=[['caminar_rigido',90]];
function phaseIdx(week){ const o=S.settings.phaseOverride; if(o!=null&&o!=='') return +o; return Math.max(0,PHASES.findIndex(p=>week>=p.from&&week<=p.to)); }
function wk(){ const d=daysBetween(S.profile.start,todayStr()); return Math.min(52,Math.max(1,Math.floor(d/7)+1)); }
function workout(id,pi,week){
  const P=PHASES[pi];
  const str=(list)=>({type:'sets',items:list.map(e=>({ex:e,sets:P.sets,reps:P.reps,secs:0,rest:P.rest}))});
  if(id==='A') return Object.assign({id,n:'Piernas y equilibrio'},str(['pierna_frente','pierna_atras','talones','bisagra']));
  if(id==='B') return Object.assign({id,n:'Brazo y tronco'},str(['empuje_pared','curl1','press1','frontal1','talones']));
  if(id==='C') return {id,n:'Cardio de pie · Circuito',type:'circuit',items:['marcha_recta','boxeo1','talones','caminar_rigido'].map(e=>({ex:e})),work:P.cw,rest:P.cr,rounds:P.rounds,roundRest:75};
  if(id==='W') return {id,n:'Caminata',type:'intervals',items:[{ex:'caminar_rigido',secs:P.walk*60,label:'Caminata a paso firme'}]};
  return null;
}
function scheduleFor(pi,week){ const fri= week%2?'A':'B'; return ['A','W','B','C',fri,'W',null]; }
function steps(w){
  const out=[]; const push=(o)=>out.push(o);
  WARMUP.forEach(([e,s])=>push({k:'work',ex:e,secs:s,tag:'Calentamiento'}));
  push({k:'rest',secs:20,tag:'Prepárate'});
  if(w.type==='sets'){
    w.items.forEach((it,i)=>{ for(let s=1;s<=it.sets;s++){
      push({k:'work',ex:it.ex,reps:it.reps,secs:it.secs,set:s,sets:it.sets,tag:'Serie '+s+' de '+it.sets});
      const last = i===w.items.length-1 && s===it.sets; if(!last) push({k:'rest',secs:it.rest,tag:'Descanso'});
    }});
  } else if(w.type==='circuit'){
    for(let r=1;r<=w.rounds;r++){ w.items.forEach((it,i)=>{
      push({k:'work',ex:it.ex,secs:w.work,tag:'Ronda '+r+' de '+w.rounds});
      const lastInRound=i===w.items.length-1;
      if(!lastInRound) push({k:'rest',secs:w.rest,tag:'Descanso'});
      else if(r<w.rounds) push({k:'rest',secs:w.roundRest,tag:'Fin de ronda '+r});
    });}
  } else {
    w.items.forEach(it=>push({k:'work',ex:it.ex,secs:it.secs,tag:it.label}));
  }
  COOLDOWN.forEach(([e,s])=>push({k:'work',ex:e,secs:s,tag:'Vuelta a la calma: camina suave y respira'}));
  return out;
}
function estMin(w){ return Math.round(steps(w).reduce((a,s)=>a+(s.secs||(s.reps?(s.reps*(EX[s.ex].side?2:1)*3.5):0)),0)/60); }

const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const fmtD=s=>{const d=parse(s);return d.getDate()+' '+['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][d.getMonth()];};

function curW(){ const w=[...S.weights].sort((a,b)=>a.d<b.d?-1:1); return w.length?w[w.length-1].w:S.profile.startWeight; }
function sortedW(){ return [...S.weights].sort((a,b)=>a.d<b.d?-1:1); }
function bmi(w){ const h=S.profile.height/100; return w/(h*h); }
function milestones(){ const st=S.profile.startWeight, g=S.profile.goal, m=[]; for(let x=Math.floor((st-1)/10)*10; x>g; x-=10) m.push(x); m.push(g); return m; }

function inicio(){
  const w=wk(), pi=phaseIdx(w), sch=scheduleFor(pi,w), dow=(new Date().getDay()+6)%7, id=sch[dow];

  const next=milestones().find(m=>cw>m);
  const mon=new Date(); mon.setDate(mon.getDate()-dow); const monS=ds(mon);
  const thisWeek=S.sessions.filter(s=>s.d>=monS).length, planned=sch.filter(Boolean).length;

  const days=new Set(S.sessions.map(s=>s.d)); let streak=0; const d=new Date();

  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ if(confirm('¿Borrar este registro?')){ S.weights=S.weights.filter(e=>e.d!==b.dataset.del); save(); progreso(); }});
  drawChart(); calMonth=calMonth||new Date(); drawCal();
  $('#cP').onclick=()=>{calMonth.setMonth(calMonth.getMonth()-1);drawCal();}; $('#cN').onclick=()=>{calMonth.setMonth(calMonth.getMonth()+1);drawCal();};
}
let calMonth=null;
function drawCal(){
  const y=calMonth.getFullYear(), m=calMonth.getMonth(), first=new Date(y,m,1), off=(first.getDay()+6)%7, n=new Date(y,m+1,0).getDate();
  $('#calT').textContent=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][m]+' '+y;
  const tr=new Set(S.sessions.map(s=>s.d)), wg=new Set(S.weights.map(s=>s.d)), t=todayStr();
  let h=['L','M','M','J','V','S','D'].map(x=>`<div class="h">${x}</div>`).join('')+'<div></div>'.repeat(off);
  for(let d=1;d<=n;d++){const k=y+'-'+pad(m+1)+'-'+pad(d); h+=`<div class="c ${tr.has(k)?'tr':''} ${k===t?'td':''} ${wg.has(k)?'wg':''}">${d}</div>`;}
  $('#cal').innerHTML=`<div class="cal">${h}</div>`;
}
function drawChart(){
  const all=sortedW(), t=todayStr(); if(!all.length){$('#chart').innerHTML='';return;}
  let from=all[0].d; if(range==='1m'){const d=new Date();d.setMonth(d.getMonth()-1);from=ds(d);} if(range==='3m'){const d=new Date();d.setMonth(d.getMonth()-3);from=ds(d);}
  const W=all.filter(e=>e.d>=from); const pts=W.length?W:[all[all.length-1]];
  const x0=parse(pts[0].d<from?pts[0].d:from); let x1=parse(t>pts[pts.length-1].d?t:pts[pts.length-1].d);
  if(range==='todo'){ const e=parse(S.profile.start); e.setDate(e.getDate()+365); if(e>x1) x1=e; }
  const span=Math.max(7*864e5,x1-x0);
  const st=S.profile.startWeight, g=S.profile.goal, s0=S.profile.start;
  const planAt=d=>{const k=daysBetween(s0,ds(d))/365; return st-(st-g)*Math.max(0,Math.min(1,k));};
  let ys=pts.map(p=>p.w).concat([planAt(x0),planAt(x1)]); if(range==='todo') ys.push(g);
  let lo=Math.min(...ys)-1.5, hi=Math.max(...ys)+1.5;
  const Wd=340,H=200,pl=34,pr=8,pt=10,pb=22;
  const X=d=>pl+(Wd-pl-pr)*((d-x0)/span), Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let s='';
  const ticks=5; for(let i=0;i<=ticks;i++){const v=lo+(hi-lo)*i/ticks; s+=`<line x1="${pl}" x2="${Wd-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#8884"/><text x="${pl-4}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="#888">${Math.round(v)}</text>`;}
  s+=`<text x="${pl}" y="${H-6}" font-size="10" fill="#888">${fmtD(ds(x0))} ${String(x0.getFullYear()).slice(2)}</text><text x="${Wd-pr}" y="${H-6}" font-size="10" fill="#888" text-anchor="end">${fmtD(ds(x1))} ${String(x1.getFullYear()).slice(2)}</text>`;
  if(g>=lo&&g<=hi) s+=`<line x1="${pl}" x2="${Wd-pr}" y1="${Y(g)}" y2="${Y(g)}" stroke="currentColor" stroke-dasharray="6 4"/><text x="${Wd-pr}" y="${Y(g)-4}" font-size="10" text-anchor="end" fill="currentColor">meta</text>`;
  const pa=[]; for(let i=0;i<=30;i++){const d=new Date(+x0+span*i/30); pa.push(X(d).toFixed(1)+','+Y(planAt(d)).toFixed(1));} s+=`<polyline points="${pa.join(' ')}" fill="none" stroke="#aaa" stroke-width="2" stroke-dasharray="2 4"/>`;
  s+=`<polyline points="${pts.map(p=>X(parse(p.d)).toFixed(1)+','+Y(p.w).toFixed(1)).join(' ')}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach(p=>s+=`<circle cx="${X(parse(p.d)).toFixed(1)}" cy="${Y(p.w).toFixed(1)}" r="3.5" fill="currentColor"/>`);
  $('#chart').innerHTML=`<svg viewBox="0 0 ${Wd} ${H}" style="width:100%;display:block">${s}</svg>`;
}
function weightForm(){
  openModal(`<div class="row between"><h2 style="margin:0">Registrar peso</h2><button class="x" onclick="closeModal()">✕</button></div>
   <div class="grid2"><div><label>Peso (kg)</label><input id="f_w" type="text" inputmode="decimal" value="${numStr(curW())}"></div>
   <div><label>Fecha</label><input id="f_d" type="date" value="${todayStr()}"></div></div>
   <label>Cintura en cm (opcional)</label><input id="f_c" type="text" inputmode="decimal" placeholder="A la altura del ombligo">
   <label>Nota (opcional)</label><input id="f_n" placeholder="Ej: semana con mucho estudio">
   <p class="small mut">Consejo: pésate siempre a la misma hora, idealmente en la mañana después de ir al baño. Es normal que el peso suba y baje un poco de un día a otro; importa la tendencia.</p>
   <button class="btn" id="f_ok">Guardar</button>`);
  $('#f_ok').onclick=()=>{
    const w=num($('#f_w').value); if(!w||w<30||w>350){alert('Ingresa un peso válido.');return;}
    const d=$('#f_d').value||todayStr(); S.weights=S.weights.filter(e=>e.d!==d);
    const c=num($('#f_c').value); S.weights.push({d,w,waist:isNaN(c)?null:c,note:$('#f_n').value.trim()}); save(); closeModal(); render();
  };
}

/* ---------- Ajustes ---------- */
function ajustes(){
  const p=S.profile;
  view.innerHTML=`
  <div class="card"><h2>Apariencia</h2><div class="seg" id="thSeg"><button data-t="light" class="${isDark()?'':'on'}">☀ Claro</button><button data-t="dark" class="${isDark()?'on':''}">☾ Nocturno</button></div>
   <label>Fondo animado</label><div class="seg" id="fxSeg">${[['ondas','Ondas'],['constelacion','Constelación'],['pesas','Pesas'],['none','Ninguno']].map(o=>`<button data-f="${o[0]}" class="${(document.documentElement.dataset.fx||'ondas')===o[0]?'on':''}">${o[1]}</button>`).join('')}</div></div>
  <div class="card"><h2>Perfil y meta</h2>
   <label>Nombre</label><input id="a_n" value="${esc(p.name)}">
   <div class="grid2"><div><label>Estatura (cm)</label><input id="a_h" type="text" inputmode="decimal" value="${numStr(p.height)}"></div><div><label>Edad</label><input id="a_a" type="text" inputmode="decimal" value="${p.age||''}"></div></div>
   <div class="grid2"><div><label>Peso inicial (kg)</label><input id="a_w" type="text" inputmode="decimal" value="${numStr(p.startWeight)}"></div><div><label>Meta (kg)</label><input id="a_g" type="text" inputmode="decimal" value="${numStr(p.goal)}"></div></div>
   <label>Inicio del plan</label><input id="a_s" type="date" value="${p.start}">
   <br><br><button class="btn" id="a_ok">Guardar cambios</button></div>
  <div class="card"><h2>Fase del plan</h2><p class="small mut" style="margin-top:0">Normalmente avanza sola según la semana. Si una fase te queda muy dura, puedes quedarte en la anterior un tiempo.</p>
   <select id="a_p"><option value="">Automática (según semana)</option>${PHASES.map((x,i)=>`<option value="${i}" ${S.settings.phaseOverride==i&&S.settings.phaseOverride!==null&&S.settings.phaseOverride!==''?'selected':''}>Fase ${i+1}: ${x.n}</option>`).join('')}</select></div>
  <div class="card"><h2>Sonido</h2><label style="display:flex;gap:10px;align-items:center;color:var(--fg);font-size:15px"><input type="checkbox" id="a_snd" style="width:auto" ${S.settings.sound?'checked':''}> Pitidos al terminar cada tiempo</label><p class="small mut">Además de los pitidos, el teléfono vibra al terminar cada tiempo.</p></div>
  <div class="card"><h2>Respaldo</h2><p class="small mut" style="margin-top:0">Tus datos viven solo en este teléfono. Descarga un respaldo de vez en cuando (por ejemplo, una vez al mes) y guárdalo en Google Drive o envíatelo por WhatsApp.</p>
   <div class="grid2"><button class="btn" id="a_exp">Descargar respaldo</button><button class="btn w" id="a_imp">Restaurar</button></div><input type="file" id="a_file" accept=".json,application/json" class="hide"></div>
  <div class="card"><h2>Borrar todo</h2><button class="btn w" id="a_rst">Borrar mis datos</button></div>
  ${installHint()}`;
  document.querySelectorAll('#thSeg button').forEach(b=>b.onclick=()=>setTheme(b.dataset.t));
  document.querySelectorAll('#fxSeg button').forEach(b=>b.onclick=()=>{ BG.set(b.dataset.f); document.querySelectorAll('#fxSeg button').forEach(x=>x.classList.toggle('on',x===b)); });
  $('#a_ok').onclick=()=>{ const g=num($('#a_g').value), w=num($('#a_w').value); if(!g||!w||g>=w){alert('La meta debe ser menor al peso inicial.');return;}
    Object.assign(p,{name:$('#a_n').value.trim(),height:num($('#a_h').value)||p.height,age:num($('#a_a').value),startWeight:w,goal:g,start:$('#a_s').value||p.start}); save(); alert('Guardado'); render(); };
  $('#a_p').onchange=e=>{S.settings.phaseOverride=e.target.value===''?null:+e.target.value; save(); render();};
  $('#a_snd').onchange=e=>{S.settings.sound=e.target.checked; save();};
  $('#a_exp').onclick=()=>{ const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='mi-progreso-respaldo-'+todayStr()+'.json'; document.body.appendChild(a); a.click(); a.remove(); };
  $('#a_imp').onclick=()=>$('#a_file').click();
  $('#a_file').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{const d=JSON.parse(r.result); if(!d.profile) throw 0; if(confirm('Esto reemplaza tus datos actuales. ¿Continuar?')){S=d; save(); render();}}catch(x){alert('Archivo no válido.');} }; r.readAsText(f); };
  $('#a_rst').onclick=()=>{ if(confirm('¿Seguro? Se borrará todo tu historial.') && confirm('Última confirmación: ¿borrar todo?')){ localStorage.removeItem(KEY); S=null; render(); } };
}

/* =========================================================
   REPRODUCTOR DE ENTRENAMIENTO
   ========================================================= */
let PL=null, AC=null, wakeLock=null;
function beep(n=1,f=880){ if(!S.settings.sound||!AC) return; for(let i=0;i<n;i++){ const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=f; o.connect(g); g.connect(AC.destination); const t=AC.currentTime+i*0.22; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.4,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.18); o.start(t); o.stop(t+0.2);} try{navigator.vibrate&&navigator.vibrate(n>1?[150,80,150]:120);}catch(e){} }
async function lockScreen(){ try{ if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(PL&&document.visibilityState==='visible') lockScreen(); });
function startPlayer(w){
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); AC.resume(); }catch(e){}
  lockScreen();
  PL={w,st:steps(w),i:0,t0:Date.now(),end:0,paused:false,left:0,timer:null};
  $('#player').classList.remove('hide'); document.body.style.overflow='hidden';
  goStep(0);
}
function tap(el,fn){
  if(!el) return; let last=0, sx=0, sy=0;
  el.addEventListener('touchstart',e=>{const t=e.changedTouches[0]; sx=t.clientX; sy=t.clientY;},{passive:true});
  el.addEventListener('touchend',e=>{const t=e.changedTouches[0]; if(Math.abs(t.clientX-sx)>20||Math.abs(t.clientY-sy)>20) return; e.preventDefault(); last=Date.now(); fn(el);},{passive:false});
  el.addEventListener('click',()=>{ if(Date.now()-last<700) return; fn(el); });
}
function goStep(i){
  clearInterval(PL.timer);
  if(i>=PL.st.length) return finish();
  PL.i=Math.max(0,i); const s=PL.st[PL.i]; PL.paused=false;
  PL.end= s.secs ? Date.now()+s.secs*1000 : 0;
  drawStep();
  if(s.secs){ PL.timer=setInterval(tick,250); }
}
function tick(){
  if(PL.paused) return; const s=PL.st[PL.i]; const left=Math.ceil((PL.end-Date.now())/1000);
  const el=$('#pT'); if(el) el.textContent=fmtS(Math.max(0,left));
  if(left<=3&&left>0&&left!==PL.lastB){PL.lastB=left; beep(1,660);}
  if(left<=0){ beep(s.k==='rest'?2:3, s.k==='rest'?990:880); goStep(PL.i+1); }
}
const fmtS=s=>s>=60?Math.floor(s/60)+':'+pad(s%60):String(s);
function nextWork(from){ for(let j=from;j<PL.st.length;j++) if(PL.st[j].k==='work') return PL.st[j]; return null; }
function drawStep(){
  const s=PL.st[PL.i], P=$('#player'), rest=s.k==='rest', pr=(PL.i/PL.st.length*100).toFixed(1);
  P.classList.toggle('rest',rest);
  const show = rest ? nextWork(PL.i+1) : s; const x=show?EX[show.ex]:null;
  let target;
  if(rest) target=`<div class="tgt" id="pT">${fmtS(s.secs)}</div>`;
  else if(s.reps) target=`<div class="tgt">${s.reps}<span style="font-size:22px;letter-spacing:0"> reps${x.side?' por lado':''}</span></div>`;
  else target=`<div class="tgt" id="pT">${fmtS(s.secs)}</div>`;
  P.innerHTML=`
   <div class="top"><button class="x" id="pX" style="color:inherit">✕</button><div class="small"><b>${esc(PL.w.n)}</b></div><div class="small mut">${PL.i+1}/${PL.st.length}</div></div>
   <div class="prog"><i style="width:${pr}%"></i></div>
   <div class="stage">
    <div class="mut small" style="margin-bottom:6px">${rest?(esc(s.tag)+(x?' · Sigue: <b>'+x.n+'</b>':'')):esc(s.tag||'')}</div>
    <div class="anim" id="pA"></div>
    <h2>${rest?(s.tag==='Prepárate'?'Prepárate':'Descansa'):x.n}</h2>
    ${target}
    ${!rest&&x?`<ul class="cues">${x.c.map(c=>`<li>${c}</li>`).join('')}</ul>`:''}
   </div>
   <div class="ctr">
    <button class="btn w" id="pB" style="flex:0 0 64px">‹</button>
    ${rest?`<button class="btn w" id="p15" style="flex:0 0 80px">+15s</button><button class="btn" id="pN">Saltar</button>`
     : s.reps?`<button class="btn" id="pN">Hecho ✓</button>`:`<button class="btn w" id="pP" style="flex:0 0 96px">Pausa</button><button class="btn" id="pN">Siguiente</button>`}
   </div>`;
  if(x) mountAnim($('#pA'),show.ex,rest?!isDark():isDark()); else $('#pA').classList.add('hide');
  const my=PL.i;
  tap($('#pX'),()=>{ if(confirm('¿Salir del entrenamiento? No se guardará.')) closePlayer(); });
  tap($('#pB'),()=>{ if(PL&&PL.i===my) goStep(my-1); });
  tap($('#pN'),()=>{ if(PL&&PL.i===my) goStep(my+1); });
  tap($('#p15'),()=>{PL.end+=15000; tick();});
  tap($('#pP'),b=>{ if(!PL.paused){PL.paused=true;PL.left=PL.end-Date.now();b.textContent='Seguir';} else {PL.paused=false;PL.end=Date.now()+PL.left;b.textContent='Pausa';} });
}
function finish(){
  clearInterval(PL.timer); beep(3,1046);
  const mins=Math.max(1,Math.round((Date.now()-PL.t0)/60000)); let rate='';
  const P=$('#player'); P.classList.remove('rest');
  P.innerHTML=`<div class="stage"><div style="font-size:64px">🏁</div><h2>¡Entrenamiento completo!</h2><p class="mut">${esc(PL.w.n)} · ${mins} min</p>
   <p style="margin:18px 0 0"><b>¿Cómo lo sentiste?</b></p>
   <div class="rate" style="width:100%">${['Fácil','Bien','Muy duro'].map(r=>`<button data-r="${r}">${r}</button>`).join('')}</div>
   <p class="small mut" id="rMsg" style="min-height:40px"></p></div>
   <button class="btn" id="pSave">Guardar</button>`;
  P.querySelectorAll('.rate button').forEach(b=>tap(b,()=>{ rate=b.dataset.r; P.querySelectorAll('.rate button').forEach(x=>x.classList.toggle('on',x===b));
    $('#rMsg').textContent= rate==='Fácil'?'Bien. Si se repite varias veces, haz cada repetición más lenta y controlada; la fase subirá sola con las semanas.'
      : rate==='Muy duro'?'Ok. Si se repite, puedes quedarte en la fase anterior desde Ajustes. Descansa y duerme bien.':'Perfecto, esa es la intensidad que buscamos.'; }));
  let saved=false; tap($('#pSave'),()=>{ if(saved) return; saved=true; S.sessions.push({d:todayStr(),id:PL.w.id,n:PL.w.n,mins,rate}); save(); closePlayer(); tab='inicio'; render(); });
}
function closePlayer(){ clearInterval(PL&&PL.timer); PL=null; $('#player').classList.add('hide'); $('#player').innerHTML=''; document.body.style.overflow=''; try{wakeLock&&wakeLock.release();}catch(e){} }


/* =========================================================
   FONDO ANIMADO
   ========================================================= */
const BG=(()=>{
  const cv=document.getElementById('bgfx'), ctx=cv.getContext('2d');
  let W=0,H=0,dpr=1,parts=[],last=0,running=false;
  const mode=()=>document.documentElement.dataset.fx||'ondas';
  const reduce=matchMedia('(prefers-reduced-motion: reduce)');
  function size(){ dpr=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); seed(); draw(performance.now()); }
  function seed(){
    const m=mode(); parts=[];
    if(m==='constelacion'){ const n=Math.round(Math.min(60,W*H/9000)); for(let i=0;i<n;i++) parts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,r:1+Math.random()*1.6}); }
    if(m==='pesas'){ const n=Math.round(Math.min(16,W*H/26000)); for(let i=0;i<n;i++) parts.push({x:Math.random()*W,y:Math.random()*H,v:.12+Math.random()*.25,a:Math.random()*6.28,va:(Math.random()-.5)*.006,s:.6+Math.random()*.9}); }
  }
  const ink=a=>(document.documentElement.dataset.theme==='dark'?`rgba(255,255,255,${a})`:`rgba(0,0,0,${a})`);
  function dumbbell(x,y,a,s,c){
    ctx.save(); ctx.translate(x,y); ctx.rotate(a); ctx.scale(s,s); ctx.fillStyle=c;
    const rr=(x,y,w,h,r)=>{ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h); ctx.fill();};
    rr(-14,-1.6,28,3.2,1.6); rr(-13,-8,5,16,2); rr(8,-8,5,16,2); rr(-17,-5.5,3.5,11,1.5); rr(13.5,-5.5,3.5,11,1.5);
    ctx.restore();
  }
  function draw(now){
    ctx.clearRect(0,0,W,H); const m=mode(), t=now/1000;
    if(m==='ondas'){
      for(let k=0;k<5;k++){
        ctx.beginPath(); const base=H*(.12+k*.2), amp=18+k*7, f=.006-k*.0006, sp=.25+k*.08;
        for(let x=0;x<=W+10;x+=8){ const y=base+Math.sin(x*f+t*sp+k*1.3)*amp+Math.sin(x*f*2.1-t*sp*.7)*amp*.35; x?ctx.lineTo(x,y):ctx.moveTo(x,y); }
        ctx.strokeStyle=ink(.22+k*.05); ctx.lineWidth=2.2; ctx.stroke();
      }
    } else if(m==='constelacion'){
      for(const p of parts){ p.x+=p.vx; p.y+=p.vy; if(p.x<-10)p.x=W+10; if(p.x>W+10)p.x=-10; if(p.y<-10)p.y=H+10; if(p.y>H+10)p.y=-10; }
      ctx.lineWidth=1;
      for(let i=0;i<parts.length;i++) for(let j=i+1;j<parts.length;j++){ const a=parts[i],b=parts[j],d=Math.hypot(a.x-b.x,a.y-b.y); if(d<110){ ctx.strokeStyle=ink(.28*(1-d/110)); ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); } }
      ctx.fillStyle=ink(.45); for(const p of parts){ ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill(); }
    } else if(m==='pesas'){
      for(const p of parts){ p.y-=p.v; p.a+=p.va; p.x+=Math.sin(t*.4+p.s*5)*.12; if(p.y<-30){p.y=H+30;p.x=Math.random()*W;} dumbbell(p.x,p.y,p.a,p.s*1.3,ink(.16+p.s*.06)); }
    }
  }
  function loop(now){
    if(!running) return;
    const busy = document.hidden || (typeof PL!=='undefined' && PL) || mode()==='none';
    if(!busy && now-last>33){ last=now; draw(now); }
    requestAnimationFrame(loop);
  }
  function start(){ if(running) return; running=true; requestAnimationFrame(loop); }
  function set(m){ document.documentElement.dataset.fx=m; try{localStorage.setItem('fondo',m);}catch(e){} seed(); ctx.clearRect(0,0,W,H); if(m!=='none') draw(performance.now()); }
  addEventListener('resize',size);
  size(); if(!reduce.matches) start();
  return {set,mode,redraw:()=>draw(performance.now())};
})();
render();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
